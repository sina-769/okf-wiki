<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<!-- Erzeugt von okfw (okfw.py dashboard). Projektion – nicht von Hand bearbeiten. -->
<style>
/*__FONTS__*/
/* Gestaltung: Alabaster-Grund, weiße Karten, Charcoal,
   Akzent Gelb (dunkel: Blau), IBM Plex Serif/Sans, JetBrains Mono. Datenfarben: validierte Palette
   (vier Farben bestehen den Validator für Netzdiagramme, weitere Werte erscheinen grau). */
:root {
  color-scheme: light;
  --font-heading: 'IBM Plex Serif', Georgia, 'Times New Roman', serif;
  --font-body: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  --page: #F4F3ED; --surface: #FFFFFF; --ink: #1A1A1A; --ink-2: rgba(26, 26, 26, 0.75); --muted: rgba(26, 26, 26, 0.65);
  --grid: rgba(26, 26, 26, 0.10); --border: rgba(26, 26, 26, 0.10);
  --accent: #FCE53A; --accent-hover: #E6CE34; --on-accent: #1A1A1A;
  --c1: #2a78d6; --c2: #008300; --c3: #eda100; --c4: #e87ba4; --c-other: #898781;
  --warning: #fab219;
  --edge: rgba(26, 26, 26, 0.14); --edge-hi: rgba(26, 26, 26, 0.7); --wash: rgba(26, 26, 26, 0.05);
  --shadow: rgba(0, 0, 0, 0.18);
  --code-bg: rgba(26, 26, 26, 0.08); --pre-bg: #1A1A1A; --pre-ink: #e5e5e5;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #1F1F1F; --surface: #161616; --ink: #E5E2D9; --ink-2: rgba(229, 226, 217, 0.75); --muted: rgba(229, 226, 217, 0.62);
  --grid: rgba(229, 226, 217, 0.10); --border: rgba(229, 226, 217, 0.12);
  --accent: #3a5efc; --accent-hover: #2d4fdb; --on-accent: #FFFFFF;
  --c1: #3987e5; --c2: #008300; --c3: #c98500; --c4: #d55181; --c-other: #898781;
  --edge: rgba(229, 226, 217, 0.13); --edge-hi: rgba(229, 226, 217, 0.75); --wash: rgba(229, 226, 217, 0.06);
  --shadow: rgba(0, 0, 0, 0.55);
  --code-bg: rgba(229, 226, 217, 0.10); --pre-bg: #252525; --pre-ink: #e5e5e5;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--page); color: var(--ink); }
body { font: 14px/1.5 var(--font-body); }
main { max-width: 1440px; margin: 0 auto; padding: 16px; }
h1 { font-family: var(--font-heading); font-size: 26px; font-weight: 400; margin: 0; text-wrap: balance; }
h2 { font-family: var(--font-heading); font-size: 18px; font-weight: 400; margin: 0 0 10px; text-wrap: balance; }
h3 { font-size: 13px; font-weight: 600; margin: 14px 0 6px; color: var(--ink-2); }
.hl { background: linear-gradient(180deg, transparent 60%, color-mix(in srgb, var(--accent) 30%, transparent) 65%, var(--accent) 95%); }
a { color: var(--ink); text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--accent) 55%, transparent); text-decoration-thickness: 1.5px; text-underline-offset: 3px; }
a:hover { text-decoration-color: var(--accent); text-decoration-thickness: 2.5px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.top { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.sub { color: var(--ink-2); font-size: 13px; margin-top: 4px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; min-width: 0; }
.pad { padding: 14px 16px; }
.btn-primary { background: var(--accent); color: var(--on-accent); border: 1px solid color-mix(in srgb, var(--ink) 30%, transparent); border-radius: 8px; padding: 6px 14px; font-weight: 600; font-size: 13px; cursor: pointer; }
.btn-primary:hover { background: var(--accent-hover); }
.ghost { border: 1px solid color-mix(in srgb, var(--ink) 22%, transparent); background: transparent; border-radius: 8px; padding: 4px 10px; cursor: pointer; font-size: 13px; }
.ghost:hover { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); }
.linkish { border: 0; background: none; padding: 0; cursor: pointer; text-align: left; color: var(--ink); text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--accent) 55%, transparent); text-decoration-thickness: 1.5px; text-underline-offset: 3px; font: inherit; }
.tag { display: inline-flex; align-items: center; padding: 1px 8px; font: 11px var(--font-mono); letter-spacing: 0.02em; border-radius: 999px; border: 1px solid color-mix(in srgb, var(--ink) 18%, transparent); color: var(--ink-2); background: transparent; }
button.tag { cursor: pointer; }
button.tag:hover { border-color: var(--accent); }
.seg { display: inline-flex; border: 1px solid color-mix(in srgb, var(--ink) 22%, transparent); border-radius: 8px; overflow: hidden; }
.segb { border: 0; background: transparent; padding: 4px 12px; font-size: 13px; cursor: pointer; }
.segb + .segb { border-left: 1px solid color-mix(in srgb, var(--ink) 22%, transparent); }
.segb[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); font-weight: 600; }

.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 8px; margin-bottom: 12px; }
.tile { padding: 12px 14px; }
.tile .l { color: var(--ink-2); font-size: 12px; }
.tile .v { font-size: 26px; font-weight: 600; line-height: 1.25; }
.tile .s { color: var(--muted); font-size: 12px; }

.netz { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 12px; margin-bottom: 12px; }
.netz.wide { grid-template-columns: minmax(0, 1fr); }
@media (max-width: 960px) { .netz { grid-template-columns: minmax(0, 1fr); } }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--border); }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); background: transparent; border-radius: 999px; padding: 3px 10px; font-size: 13px; cursor: pointer; }
.chip:hover { background: var(--wash); }
.chip[aria-pressed="false"] { opacity: 0.45; }
.chip[aria-pressed="false"] .lab { text-decoration: line-through; }
.chip .n { color: var(--muted); }
select, input[type="search"] { font: inherit; font-size: 13px; color: var(--ink); background: var(--surface); border: 1px solid color-mix(in srgb, var(--ink) 22%, transparent); border-radius: 8px; padding: 4px 8px; max-width: 100%; }
input[type="search"] { width: 14em; }
label.check { display: inline-flex; gap: 5px; align-items: center; font-size: 13px; color: var(--ink-2); }
.edgekey, .colorkey { font-size: 12px; color: var(--muted); display: inline-flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.colorkey span { display: inline-flex; gap: 4px; align-items: center; }
.hitcount { font-size: 12px; color: var(--ink-2); }
.graphwrap { position: relative; }
#graph { width: 100%; height: min(72vh, 780px); min-height: 420px; display: block; cursor: grab; touch-action: none; user-select: none; }
#graph.panning { cursor: grabbing; }
.zoom { position: absolute; right: 10px; bottom: 10px; display: flex; gap: 4px; }
.zoom button { background: var(--surface); }
.edge { stroke: var(--edge); stroke-width: 1; vector-effect: non-scaling-stroke; }
.edge.src { stroke-dasharray: 3 3; }
.edge.hi { stroke: var(--edge-hi); stroke-width: 1.5; }
.node { cursor: pointer; }
.node .dot { stroke: var(--surface); stroke-width: 1.5; vector-effect: non-scaling-stroke; filter: drop-shadow(0 1px 1.5px var(--shadow)); }
.node .dot.ring { stroke-width: 2.6; }
.node .halo { fill: none; stroke: var(--ink); stroke-width: 2; vector-effect: non-scaling-stroke; opacity: 0; }
.node .grab { fill: transparent; stroke: none; } /* Trefferfläche größer als der kleine Punkt */
.node.sel .halo, .node.hit .halo { opacity: 1; }
.node.dim, .edge.dim, .label.dim { opacity: 0.12; }
.label { fill: var(--ink-2); pointer-events: none; paint-order: stroke; stroke: var(--surface); stroke-linejoin: round; }

.cols[hidden], .seg[hidden] { display: none; }
.cols-bar { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--grid); }
.cols-scroll { max-height: calc(100vh - 80px); min-height: 560px; overflow: auto; } /* fast bildschirmhoch */
#colsvg { display: block; }
.chead { font-family: var(--font-heading); font-size: 15px; fill: var(--ink); }
.crow { cursor: pointer; }
.crow .bg { fill: var(--surface); stroke: var(--grid); stroke-width: 1; }
.crow:hover .bg, .crow:focus-visible .bg { fill: color-mix(in srgb, var(--accent) 14%, var(--surface)); }
.crow .t1 { font-size: 12.5px; font-weight: 600; fill: var(--ink); }
.crow .t2 { font-size: 11.5px; fill: var(--muted); }
.crow .dot { stroke: none; }
.crow .dot.ring { stroke-width: 2; }
.crow.sel .bg, .crow.hit .bg { stroke: var(--ink); stroke-width: 1.5; }
.crow.dim { opacity: 0.28; }
.cthread { fill: none; stroke: var(--edge); stroke-width: 1; }
.cthread.src { stroke-dasharray: 3 3; }
.cthread.hi { stroke: var(--edge-hi); stroke-width: 1.6; }
.cthread.dim { opacity: 0.12; }

/* Vorschaukarte (Hover, in der Spaltenansicht per Klick angeheftet) */
#tip { position: fixed; z-index: 15; pointer-events: none; width: min(360px, calc(100vw - 24px)); background: var(--surface); color: var(--ink); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; font-size: 13px; line-height: 1.5; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.16); display: none; }
#tip.pinned { pointer-events: auto; width: min(580px, calc(100vw - 24px)); max-height: min(80vh, 780px); overflow-y: auto; overscroll-behavior: contain; padding: 0; }
.pv-bar { position: sticky; top: 0; z-index: 1; display: flex; gap: 8px; align-items: center; padding: 8px 12px; background: var(--surface); border-bottom: 1px solid var(--grid); font: 11px var(--font-mono); color: var(--muted); }
.pv-bar .sp { flex: 1; }
.pv-bar button { font-family: var(--font-body); }
.pv-inner { padding: 14px 18px 18px; }
.pv-inner .r-head { padding-bottom: 12px; margin-bottom: 14px; }
.pv-inner .r-head h1 { font-size: 22px; line-height: 1.25; margin: 0 0 8px; }
.pv-inner .r-desc { font-size: 15px; }
.pv-inner .prose-content { font-size: 15px; line-height: 1.65; }
.pv-inner .prose-content h2 { font-size: 18px; margin: 24px 0 8px; }
.pv-inner .prose-content h3 { font-size: 16px; margin: 18px 0 6px; }
.pv-inner .prose-content p, .pv-inner .prose-content li { line-height: 1.65; }
.pv-inner .prose-content blockquote { padding: 10px 14px; margin: 14px 0; }
.pv-inner .r-section { margin-top: 20px; padding-top: 12px; }
.pv-inner .r-section h2 { font-size: 16px; }
.pv-inner .lit li { font-size: 13px; padding: 8px 0 8px 2em; }
.pv-inner .r-apa { font-size: 13px; }
.pv-kind { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; font: 11px var(--font-mono); color: var(--muted); }
.pv-title { font-family: var(--font-heading); font-size: 17px; line-height: 1.3; margin: 6px 0; }
.pv-cite { font-size: 12px; color: var(--ink-2); margin: -2px 0 6px; }
.pv-desc { margin: 0 0 6px; }
.pv-ex { color: var(--ink-2); margin: 0 0 6px; display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; overflow: hidden; }
.pv-out { font-size: 12px; color: var(--muted); }
.pv-foot { display: flex; gap: 8px; align-items: center; justify-content: space-between; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--grid); font-size: 11px; color: var(--muted); }

.panel { padding: 14px 16px; max-height: calc(min(72vh, 780px) + 54px); overflow: auto; }
.netz.wide .panel { max-height: none; }
.panel .empty { color: var(--muted); }
.meta { display: flex; flex-wrap: wrap; gap: 6px 10px; color: var(--ink-2); font-size: 12px; margin: 6px 0 10px; align-items: center; }
.pill { display: inline-flex; align-items: center; gap: 6px; }
.desc { margin: 0 0 10px; }
.excerpt { color: var(--ink-2); margin: 0 0 10px; }
.list { list-style: none; margin: 0; padding: 0; }
.list li { margin: 2px 0; }
.list button { border: 0; background: transparent; padding: 2px 4px; margin-left: -4px; border-radius: 4px; cursor: pointer; text-align: left; display: inline-flex; gap: 6px; align-items: center; }
.list button:hover { background: var(--wash); }
.kind { color: var(--muted); font-size: 11px; }
details > summary { cursor: pointer; padding: 12px 14px; font-weight: 600; }
.panel details.links > summary { padding: 2px 0; margin: 14px 0 4px; font-size: 13px; color: var(--ink-2); }
.panel details.links[open] > summary { margin-bottom: 6px; }
.note { font-size: 12px; color: var(--muted); }


.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 6px 8px; text-align: left; border-bottom: 1px solid var(--grid); vertical-align: top; }
th { font-weight: 600; color: var(--ink-2); font-size: 12px; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.pages th { cursor: pointer; white-space: nowrap; }
.pages th[aria-sort="ascending"]::after { content: " ▲"; }
.pages th[aria-sort="descending"]::after { content: " ▼"; }
.pages tbody tr { cursor: pointer; }
.pages tbody tr:hover { background: var(--wash); }
.pages td .d { color: var(--muted); font-size: 12px; }
footer { color: var(--muted); font-size: 12px; margin: 16px 0 8px; }

/* Leseansicht (Aufbau wie ein Blogartikel) */
body.reading { overflow: hidden; }
.reader { position: fixed; inset: 0; z-index: 20; background: var(--page); overflow-y: auto; padding: 16px; }
.reader[hidden] { display: none; }
.reader-bar { max-width: 56rem; margin: 0 auto 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.reader-bar .sp { flex: 1; }
.r-card { max-width: 56rem; margin: 0 auto 32px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 28px 20px; }
@media (min-width: 768px) { .r-card { padding: 44px 48px; } }
.crumb { font-size: 13px; color: var(--muted); margin-bottom: 18px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.r-head { border-bottom: 1px solid var(--border); padding-bottom: 20px; margin-bottom: 24px; }
.r-head h1 { font-size: clamp(26px, 4vw, 38px); line-height: 1.2; margin-bottom: 12px; }
.r-desc { font-size: 17px; color: var(--ink-2); margin: 0 0 12px; }
.r-meta { font: 12px var(--font-mono); color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
.r-section { margin-top: 32px; padding-top: 16px; border-top: 1px solid var(--border); font-size: 14px; }
.r-section h2 { font-size: 18px; }
.r-section details > summary { padding: 4px 0; font-weight: 600; font-size: 14px; color: var(--ink-2); }
.r-section details.r-fold > summary { padding: 0; font-weight: 400; color: var(--ink); }
.r-fold > summary h2 { display: inline; margin: 0; }
.r-fold[open] > summary { margin-bottom: 10px; }
.r-kicker { font: 13px var(--font-mono); color: var(--muted); margin-bottom: 8px; }
.metalink { border: 0; background: none; padding: 0; font: inherit; color: inherit; cursor: pointer; text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--accent) 55%, transparent); text-decoration-thickness: 1.5px; text-underline-offset: 3px; }
.metalink:hover { color: var(--ink); text-decoration-color: var(--accent); }
.rights { width: 100%; border-collapse: collapse; font-size: 14px; margin: 8px 0 4px; }
.rights th, .rights td { text-align: left; vertical-align: top; padding: 7px 10px 7px 0; border-bottom: 1px solid var(--grid); }
.rights th { font-weight: 400; font-size: 14px; color: var(--ink); width: 42%; }
.r-note { color: var(--muted); font-size: 13px; }
.r-lic { margin: 0 0 6px; overflow-wrap: anywhere; }
.fundweg { list-style: none; padding: 0; margin: 0; }
.fundweg li { padding: 4px 0; overflow-wrap: anywhere; }
.fundweg code { font-family: var(--font-mono); font-size: 0.85em; background: var(--code-bg); padding: 1px 5px; border-radius: 4px; }
.right { display: inline-block; white-space: nowrap; padding: 1px 8px; border-radius: 999px; font: 600 11px var(--font-mono); border: 1px solid color-mix(in srgb, var(--ink) 18%, transparent); }
.right.r-ja { background: color-mix(in srgb, var(--accent) 28%, transparent); }
.right.r-nein { background: color-mix(in srgb, var(--ink) 12%, transparent); }
.right.r-fragen { background: color-mix(in srgb, var(--warning) 22%, transparent); }
.facet-list { list-style: none; padding: 0; margin: 8px 0 0; }
.facet-list li { padding: 9px 0; border-bottom: 1px solid var(--grid); }
.facet-list .linkish { font-size: 16px; line-height: 1.4; }
.fl-sub { font-size: 13px; color: var(--muted); margin-top: 3px; }
.r-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.r-apa a { overflow-wrap: anywhere; }
.r-apa { overflow-wrap: anywhere; margin-top: 14px; padding: 12px 16px; border-left: 3px solid var(--ink); background: color-mix(in srgb, var(--accent) 12%, transparent); border-radius: 8px; font-size: 15px; color: var(--ink); }
.r-apa-l { font: 600 11px var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.lit { list-style: none; padding: 0; margin: 12px 0 0; }
.lit li { padding: 10px 0 10px 2em; text-indent: -2em; border-bottom: 1px solid var(--grid); line-height: 1.6; color: var(--ink-2); }
.lit li:target { background: color-mix(in srgb, var(--accent) 14%, transparent); }
.lit .lit-entry a { color: var(--ink); overflow-wrap: anywhere; }
.lit .lit-meta { display: inline-flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; margin-left: 10px; text-indent: 0; vertical-align: 1px; }
.lit .lit-meta .linkish { font-size: 12px; color: var(--muted); }
.tag.citation { border-style: dashed; }
.tag.internal { border-color: var(--warning); background: color-mix(in srgb, var(--warning) 18%, transparent); color: var(--ink); }

.prose-content { font-size: 17px; line-height: 1.7; color: var(--ink-2); overflow-wrap: break-word; }
.prose-content h2 { font-family: var(--font-heading); font-size: 22px; font-weight: 400; color: var(--ink); margin: 40px 0 14px; }
.prose-content h3 { font-family: var(--font-heading); font-size: 18px; font-weight: 400; color: var(--ink); margin: 32px 0 10px; }
.prose-content h4 { font-size: 16px; color: var(--ink); margin: 24px 0 8px; }
.prose-content > :first-child { margin-top: 0; }
.prose-content p { margin: 0 0 16px; line-height: 1.75; }
.prose-content ul, .prose-content ol { padding-left: 24px; margin: 16px 0; }
.prose-content li { margin-bottom: 6px; line-height: 1.75; }
.prose-content strong { color: var(--ink); font-weight: 600; }
.prose-content a { color: var(--ink); }
.prose-content a.missing { text-decoration-style: dashed; text-decoration-color: var(--muted); cursor: help; }
.prose-content .cite a { text-decoration-thickness: 1px; }
.prose-content code { font-family: var(--font-mono); font-size: 0.85em; background: var(--code-bg); color: var(--ink); padding: 2px 6px; border-radius: 4px; }
.prose-content pre { font-family: var(--font-mono); background: var(--pre-bg); color: var(--pre-ink); padding: 16px 20px; border-radius: 8px; overflow-x: auto; font-size: 14px; line-height: 1.6; margin: 24px 0; }
.prose-content pre code { background: transparent; padding: 0; color: inherit; font-size: inherit; }
/* Textdiagramme (```text, ASCII-Bäume): heller Grund wie eine Abbildung, ohne Ligaturen, Zeilenhöhe so,
   dass die Rahmenzeichen von JetBrains Mono (Höhe 1,52 em) senkrecht durchgehen; breite Bäume scrollen waagerecht. */
.prose-content pre.diagram { background: var(--wash); color: var(--ink); border: 1px solid var(--border); font-size: 13.5px; line-height: 1.45; font-variant-ligatures: none; tab-size: 4; white-space: pre; }
.pv-inner .prose-content pre.diagram { font-size: 12px; padding: 12px 14px; }
@media (max-width: 600px) { .prose-content pre, .prose-content pre.diagram { font-size: 12px; padding: 12px 14px; } }
/* Sprung zu einer offenen Stelle */
.prose-content .flash { animation: flash 2.6s ease-out 1; border-radius: 6px; scroll-margin: 80px; }
@keyframes flash { 0%, 45% { box-shadow: 0 0 0 3px var(--accent); } 100% { box-shadow: 0 0 0 3px transparent; } }
.prose-content blockquote { border-left: 3px solid var(--ink); background: color-mix(in srgb, var(--accent) 14%, transparent); padding: 14px 20px; border-radius: 8px; margin: 24px 0; }
.prose-content blockquote p { color: var(--ink); margin-bottom: 0; }
.prose-content blockquote p + p { margin-top: 10px; }
.prose-content blockquote.callout.todo { border-left: 3px solid color-mix(in srgb, var(--ink) 22%, transparent); background: var(--wash); }
.prose-content blockquote.callout.todo::before { content: "Offen"; display: block; font: 600 11px var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.prose-content blockquote.callout.contra { border-left: 3px solid var(--warning); background: color-mix(in srgb, var(--warning) 14%, transparent); }
.prose-content table { width: 100%; border-collapse: collapse; margin: 24px 0; font-size: 15px; display: block; overflow-x: auto; }
.prose-content thead { border-bottom: 1.5px solid var(--ink); }
.prose-content th { text-align: left; padding: 10px 14px; font-weight: 600; color: var(--ink); font-size: 14px; }
.prose-content td { padding: 10px 14px; border-bottom: 1px solid var(--grid); vertical-align: top; }
.prose-content hr { border: 0; border-top: 1px solid var(--border); margin: 32px 0; }
.prose-content .footnote { font-size: 14px; color: var(--muted); margin-top: 40px; }
.prose-content .footnote-ref { text-decoration: none; font-size: 0.8em; padding: 0 1px; }
.prose-content img { max-width: 100%; border-radius: 14px; }

/* Sprungleiste im Kopf */
.jump { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 6px; font-size: 13px; }
.jump[hidden] { display: none; }
details.fold { margin-bottom: 12px; }
details.fold[open] > summary { border-bottom: 1px solid var(--grid); }
.sumnote { font-weight: 400; color: var(--muted); }

/* Lernpfad: Einstiegsseiten als nummerierte Schritte */
.lern { margin-bottom: 12px; }
.lern[hidden] { display: none; }
.lern-head { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.lern-head h2 { margin: 0 0 2px; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; }
.step { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 3px 10px; align-content: start; padding: 10px 12px; border: 1px solid var(--grid); border-radius: 10px; cursor: pointer; }
.step:hover { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 6%, transparent); }
.step-n { grid-row: span 3; display: inline-block; width: 26px; height: 26px; border-radius: 999px; background: var(--accent); color: var(--on-accent); font: 600 13px/26px var(--font-body); text-align: center; }
.step .linkish { font-weight: 600; line-height: 1.35; }
.step-k { display: inline-flex; gap: 5px; align-items: center; font: 11px var(--font-mono); color: var(--muted); }
.step-d { color: var(--ink-2); font-size: 12.5px; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.r-path { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font: 12px var(--font-mono); color: var(--muted); margin-bottom: 12px; }
.r-path .step-n { width: 22px; height: 22px; line-height: 22px; font-size: 12px; }
.r-path .ghost { font: 12px var(--font-body); padding: 1px 8px; }
.r-pathnav { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 32px; }
.r-pathnav button { flex: 0 1 calc(50% - 5px); min-width: 220px; text-align: left; border: 1px solid var(--border); background: transparent; border-radius: 10px; padding: 12px 14px; cursor: pointer; color: var(--ink); }
.r-pathnav button:hover { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); }
.r-pathnav .next { margin-left: auto; text-align: right; }
.r-pathnav .lbl { display: block; font: 11px var(--font-mono); letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
.r-pathnav .ttl { display: block; font-family: var(--font-heading); font-size: 16px; line-height: 1.3; margin-top: 3px; }
.r-pathnav .end { flex: 0 1 calc(50% - 5px); margin-left: auto; align-self: center; text-align: right; font-size: 13px; color: var(--muted); }
@media (max-width: 600px) { .r-pathnav button, .r-pathnav .end { flex-basis: 100%; min-width: 0; } }

/* Glossar */
.gl-bar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin-bottom: 4px; }
.letters { display: flex; flex-wrap: wrap; gap: 2px; }
.letters button { border: 0; background: none; min-width: 24px; padding: 2px 4px; border-radius: 4px; cursor: pointer; font: 600 12px var(--font-mono); color: var(--ink-2); }
.letters button:hover { background: var(--wash); color: var(--ink); }
.letters button:disabled { opacity: 0.3; cursor: default; background: none; }
.gl-cols { columns: 2 360px; column-gap: 36px; }
.gl-group h3 { font-family: var(--font-heading); font-size: 18px; font-weight: 400; color: var(--ink); margin: 14px 0 2px; padding-bottom: 2px; border-bottom: 1px solid var(--grid); break-after: avoid; }
.gl { margin: 0; }
.gl-entry { break-inside: avoid; padding: 8px 0 4px; }
.gl dt { display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: baseline; }
.gl dt .linkish { font-weight: 600; font-size: 15px; }
.gl dd { margin: 2px 0 0; color: var(--ink-2); }
.gl dd.aka { color: var(--muted); font-size: 12px; }
.gl-empty { color: var(--muted); margin: 12px 0 0; }

/* Offene Stellen */
.open-group h3 { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--ink); margin: 16px 0 4px; }
.open-list { list-style: none; padding: 0; margin: 0; }
.open-list li { padding: 8px 0; border-bottom: 1px solid var(--grid); }
.open-list .kind { margin-left: 8px; }
.open-list .snip { border: 0; background: none; padding: 0; text-align: left; cursor: pointer; font: inherit; font-size: 13px; color: var(--ink-2); }
.open-list .snip:hover { color: var(--ink); text-decoration: underline; text-decoration-color: var(--accent); }
.mark { display: inline-block; width: 10px; height: 10px; border-radius: 3px; flex: none; }
.mark.contra { background: var(--warning); }
.mark.check { background: var(--c1); }
.mark.todo { background: color-mix(in srgb, var(--ink) 30%, transparent); }
details.sub { margin-top: 16px; }
details.sub > summary { padding: 6px 0; font-size: 14px; color: var(--ink); }
details.sub details > summary { padding: 6px 0; font-weight: 400; display: list-item; }
details.sub .open-list { padding-left: 18px; }

/* Zur Freigabe */
.rel-bar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin: 4px 0 8px; }
.rel-bar label { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; color: var(--ink-2); }
.rel-bar input[type=text] { font: 13px var(--font-mono); padding: 4px 8px; border-radius: 6px; border: 1px solid color-mix(in srgb, var(--ink) 22%, transparent); background: var(--surface); color: var(--ink); min-width: 12em; }
.rel-list { list-style: none; padding: 0; margin: 0; }
.rel-list > li { padding: 10px 0; border-bottom: 1px solid var(--grid); }
.rel-head { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.rel-head input { margin: 0; }
.rel-check { font: 11px var(--font-mono); color: var(--muted); margin: 4px 0 0 22px; }
.rel-claims { margin: 6px 0 0 22px; padding-left: 18px; font-size: 13px; color: var(--ink-2); }
.rel-claims li { margin: 4px 0; }
.rel-claims sup { font: 10px var(--font-mono); color: var(--muted); }
.rel-notes { list-style: none; padding: 0; margin: 2px 0 0; font: 11px var(--font-mono); color: var(--muted); }
.rel-full { margin: 8px 0 0 22px; font-size: 14px; line-height: 1.6; }
.rel-full p, .rel-full li { line-height: 1.6; }
.rel-full p { margin: 0 0 10px; }
.rel-full h2, .rel-full h3, .rel-full h4 { font-size: 15px; margin: 16px 0 6px; }
.rel-full pre { font-size: 12px; padding: 10px 12px; margin: 12px 0; }
.rel-full .rel-hit { background: color-mix(in srgb, var(--c1) 12%, transparent); box-shadow: -3px 0 0 var(--c1); border-radius: 2px; }
.rel-full p.rel-hit { padding: 2px 6px; }
details.rel-more { margin: 6px 0 0 22px; }
details.rel-more > summary { font-size: 13px; color: var(--ink-2); cursor: pointer; padding: 4px 0; }
details.rel-more .rel-full { margin-left: 0; }
.rel-cmd { display: flex; gap: 8px; align-items: flex-start; margin-top: 14px; }
.rel-cmd code { flex: 1; font: 12px var(--font-mono); background: var(--code-bg); color: var(--ink); padding: 8px 10px; border-radius: 6px; overflow-wrap: anywhere; }
</style>
<script>
  // Hell oder dunkel vor dem ersten Zeichnen setzen: gespeicherte Wahl, sonst die des Systems.
  (() => {
    let t = null;
    try { t = localStorage.getItem("okfw-theme"); } catch (e) { t = null; }
    if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.dataset.theme = t;
  })();
</script>

<body>
<main>
  <header class="top">
    <div>

  <section class="tiles" id="tiles" aria-label="Überblick"></section>

  <section class="netz">

        </span>

        <span class="edgekey"><svg width="24" height="6" aria-hidden="true"><line x1="0" y1="3" x2="24" y2="3" stroke="currentColor"/></svg>verlinkt
          <svg width="24" height="6" aria-hidden="true"><line x1="0" y1="3" x2="24" y2="3" stroke="currentColor" stroke-dasharray="3 3"/></svg>zitiert als Quelle</span>

  <details class="card fold" id="glosscard" hidden>

<script type="application/json" id="okf-data">__DATA__</script>
<script>
(() => {
  "use strict";
  const D = JSON.parse(document.getElementById("okf-data").textContent);
  const NS = "http://www.w3.org/2000/svg";
  const $ = id => document.getElementById(id);
  const typeLabels = Object.fromEntries(D.types.map(t => [t.name, t.label]));
  const tlabel = t => typeLabels[t] || t;
  const lab = (field, value) => ((D.labels || {})[field] || {})[value] || value;
  const ACCESS = { citation: "nur Metadaten", abstract: "Abstract", fulltext: "Volltext", originaldokument: "Originaldokument" };
  const LIC = D.license_classes || {}, RACT = D.rights_actions || {};
  const RWORD = { ja: "erlaubt", bedingt: "mit Auflage", nein: "nicht erlaubt", fragen: "erst fragen" };
  const licShort = n => (!n.license ? "" : n.license.cls === "unbekannt" ? "Lizenz unbekannt"
    : n.license.name && n.license.name.length <= 28 ? n.license.name : n.license.label);

  function h(tag, attrs, ...kids) {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (k === "class") e.className = v;
      else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v);
    }
    for (const c of kids) if (c !== null && c !== undefined && c !== false) e.append(c);
    return e;
  }
  function s(tag, attrs) {
    const e = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs || {})) e.setAttribute(k, v);
    return e;
  }

  // ---------------------------------------------------------------- Daten
  const nodes = D.nodes;
  const byId = new Map(nodes.map(n => [n.id, n]));
  for (const n of nodes) { n.nb = new Set(); n.outs = new Map(); n.ins = new Map(); }
  const edges = [];
  for (const e of D.edges) {
    const a = byId.get(e.s), b = byId.get(e.t);
    if (!a || !b) continue;
    edges.push({ s: a, t: b, kind: e.kind });
    a.nb.add(b); b.nb.add(a);
    if (!a.outs.has(b)) a.outs.set(b, new Set());
    a.outs.get(b).add(e.kind);
    if (!b.ins.has(a)) b.ins.set(a, new Set());
    b.ins.get(a).add(e.kind);
  }
  // Reihenfolge der Arten in Chips, Kacheln, Tabelle, Übersichten und Schichtengraph: von der Grundlage zum
  // Querschnitt (Quellen, Entitäten, Konzepte, Synthesen, Analysen), weitere Profiltypen danach in der
  // Reihenfolge der wiki.toml, Typen außerhalb des Profils neben dem Typ ihres Ordners. Nur das Layout des
  // Netzwerkgraphen folgt weiter der wiki.toml (profileOrder), damit sich sein Bild nicht ändert.
  const profileOrder = [...D.types.map(t => t.name).filter(t => nodes.some(n => n.type === t)),
    ...[...new Set(nodes.map(n => n.type))].filter(t => !typeLabels[t]).sort()];
  const COLORDER = ["source", "entity", "concept", "synthesis", "analysis"];
  const folderType = Object.fromEntries(D.types.map(t => [t.folder, t.name]));
  const homeOf = t => { const n = nodes.find(m => m.type === t); return n && folderType[n.id.split("/")[0]]; };
  const typeOrder = [];
  for (const t of [...COLORDER, ...profileOrder.filter(x => !COLORDER.includes(x) && typeLabels[x])]) {
    if (profileOrder.includes(t) && !typeOrder.includes(t)) typeOrder.push(t);
    for (const x of profileOrder) if (!typeLabels[x] && homeOf(x) === t && !typeOrder.includes(x)) typeOrder.push(x);
  }
  for (const x of profileOrder) if (!typeOrder.includes(x)) typeOrder.push(x);
  const count = f => nodes.filter(f).length;
  const tally = list => { const m = new Map(); for (const v of list) m.set(v, (m.get(v) || 0) + 1); return [...m.entries()].sort((a, b) => b[1] - a[1] || String(a[0]).localeCompare(String(b[0]))); };
  // Lernpfad: Einstiegsseiten ([index] entry_tag) in der Reihenfolge von order, wie „Zuerst lesen“ im Root-Index
  const PATH = (D.path || []).map(id => byId.get(id)).filter(Boolean);
  const coll = new Intl.Collator("de", { sensitivity: "base", numeric: true });

  // ---------------------------------------------------------------- Farben (Art oder Umfang)
  // Vier validierte Farben; die Unterscheidung trägt zusätzlich die Form (Entitäten als Ring) bzw. die Legende.
  // Themenbereiche und Schlagwörter zeigt das Dashboard nirgends (bewusst, in allen Wikis).
  const TYPE_SLOT = { source: 1, concept: 2, entity: 3, synthesis: 4 };
  // Umfang nur anbieten, wenn Seiten ihn tragen; eine Voreinstellung ohne Treffer gilt als „alle“
  const SC = D.scope && D.scope.values.length && nodes.some(n => n.scope) ? D.scope : null;
  if (SC && SC.default && !nodes.some(n => n.scope === SC.default)) SC.default = "";
  const scopeLab = v => ((SC && SC.values.find(x => x[0] === v)) || [v, v])[1];
  const SCOPE_SLOT = SC ? Object.fromEntries(SC.values.slice(0, 4).map(([v], i) => [v, i + 1])) : {};
  // Sichtbarkeit ([visibility] in wiki.toml): nur die lokale Ausgabe kennt sie; interne Seiten tragen ein Abzeichen
  const VIS = D.visibility && nodes.some(n => n.internal) ? D.visibility : null;
  const visText = n => ((VIS && VIS.values.find(x => x[0] === n.visibility)) || [n.visibility, n.visibility])[1]
    + (n.visibility_derived ? " (abgeleitet)" : "");
  const visBadge = n => (VIS && n.internal ? h("span", { class: "tag internal", title: "Fehlt in der öffentlichen Ausgabe" }, visText(n)) : null);
  // Freigabe (nur normale Ausgabe): verfallen = die menschliche Prüfung galt einem früheren Inhalt
  const relBadge = n => (n.release === "outdated" ? h("span", { class: "tag internal", title: "Inhalt nach der menschlichen Prüfung geändert; neu prüfen und freigeben" },
    n.stable ? "stable, seit Änderung ungeprüft" : "Freigabe verfallen") : null);
  let colorBy = "type";
  function paint(n) {
    if (colorBy === "scope") {
      const slot = SCOPE_SLOT[n.scope];
      return slot ? { color: `var(--c${slot})`, ring: n.scope_derived } : { color: "var(--c-other)", ring: true };
    }
    const slot = TYPE_SLOT[n.type];
    return slot ? { color: `var(--c${slot})`, ring: n.type === "entity" } : { color: "var(--c-other)", ring: true };
  }
  function styleDot(el, p) {
    el.classList.toggle("ring", p.ring);
    el.style.fill = p.ring ? `color-mix(in srgb, ${p.color} 16%, var(--surface))` : p.color;
    el.style.stroke = p.ring ? p.color : "";
  }
  function dotSvg(p, size = 12) {
    const sv = s("svg", { width: size, height: size, viewBox: "-6 -6 12 12", "aria-hidden": "true" });
    const c = s("circle", { r: p.ring ? 4 : 5 });
    c.style.fill = p.ring ? "none" : p.color;
    if (p.ring) { c.style.stroke = p.color; c.style.strokeWidth = "2"; }
    sv.append(c);
    return sv;
  }
  const typeDot = t => dotSvg(TYPE_SLOT[t] ? { color: `var(--c${TYPE_SLOT[t]})`, ring: t === "entity" } : { color: "var(--c-other)", ring: true });

  // ---------------------------------------------------------------- Kopf und Überblick
  // Daten kommen als JJJJ-MM-TT; als Kalendertag lesen, sonst zeigt ein Browser westlich von UTC den Vortag
  const day = iso => {
    const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || "");
    const d = m ? new Date(+m[1], +m[2] - 1, +m[3]) : new Date(iso);
    return isNaN(d) ? "" : d.toLocaleDateString("de-DE", { day: "numeric", month: "long", year: "numeric" });
  };
  $("title").replaceChildren(h("span", { class: "hl" }, D.title));
  const internalCount = VIS ? count(n => n.internal) : 0;
  const outdatedCount = count(n => n.release === "outdated");
  $("subtitle").textContent = `${nodes.length} Seiten` + (internalCount ? `, davon ${internalCount} nicht öffentlich` : "")
    + (outdatedCount ? ` · ${outdatedCount} ${outdatedCount === 1 ? "Freigabe" : "Freigaben"} verfallen` : "") + ` · Stand ${day(D.generated)}`;
  const srcNodes = nodes.filter(n => n.access);
  const tiles = [
    ["Seiten", nodes.length, typeOrder.map(t => `${tlabel(t)} ${count(n => n.type === t)}`).join(" · ")],
  ];
  // keine Kacheln für Verbindungen, Quellenlage, Themenbereiche oder Schlagwörter (bewusst, in allen Wikis)
  const FW = D.fundweg_arten || {};
  const fwNodes = nodes.filter(n => n.fundweg && n.fundweg.length);
  if (fwNodes.length) {
    const model = fwNodes.filter(n => n.fundweg[0].art === "modellvorschlag").length;
    tiles.push(["Fundweg dokumentiert", fwNodes.length, [`von ${srcNodes.length} Quellen`, `${Math.round(100 * model / fwNodes.length)} % Modellvorschlag`,
      ...tally(fwNodes.map(n => n.fundweg[0].art)).filter(([a]) => a !== "modellvorschlag").slice(0, 2).map(([a, c]) => `${c} ${FW[a] || a}`)].join(" · ")]);
  }
  const licNodes = nodes.filter(n => n.license);
  if (licNodes.length) {
    const clear = licNodes.filter(n => n.license.cls !== "unbekannt").length;
    tiles.push(["Lizenz geklärt", clear, [`von ${licNodes.length} Quellen`, ...tally(licNodes.map(n => n.license.cls)).slice(0, 3).map(([c, k]) => `${k} ${LIC[c] || c}`)].join(" · ")]);
  }
  for (const [l, v, sub] of tiles) $("tiles").append(h("div", { class: "card tile" }, h("div", { class: "l" }, l), h("div", { class: "v" }, String(v)), h("div", { class: "s" }, sub)));

  // ---------------------------------------------------------------- Layout (Kräftesimulation, deterministisch)
  function hash(str) {
    let x = 2166136261;
    for (let i = 0; i < str.length; i++) { x ^= str.charCodeAt(i); x = Math.imul(x, 16777619); }
    return (x >>> 0) / 4294967296;
  }

      root.append(h("section", { class: "r-section" }, fold));
    }
    if (n.apa) {
      // Quellenkarte: Literaturangabe (Vollbeleg) unten, zum Kopieren und als RIS für Literaturverwaltungen
      const entry = h("div", { class: "r-apa" });
      entry.innerHTML = n.apa; // APA-Angabe aus citeproc (pandoc), Titel und Namen dort maskiert
      for (const a of entry.querySelectorAll("a")) { a.target = "_blank"; a.rel = "noopener"; }
      const copy = h("button", { class: "ghost", type: "button" }, "Kopieren");
      copy.addEventListener("click", () => copyText(entry.textContent.replace(/\s+/g, " ").trim(), copy));
      root.append(h("section", { class: "r-section", "aria-label": "Literaturangabe" }, entry,
        h("div", { class: "r-actions" }, copy,
          n.ris ? h("button", { class: "ghost", type: "button", onclick: () => download(`${slug(n)}.ris`, n.ris) }, "RIS herunterladen") : null)));
    }
    const refPages = new Set(n.refs.map(r => r.page).filter(Boolean));
    const outs = new Map([...n.outs].filter(([m]) => !refPages.has(m.id)));
    root.append(h("section", { class: "r-section" }, relatedDetails("Verweist auf", outs, go), relatedDetails("Verlinkt von", n.ins, go)));
  }
  // item ist eine Seite oder { facet: [kind, value] } für eine Übersichtsseite; anchor springt zu einer Stelle (offen-N)
  function openReader(item, how, anchor) {
    if (how === "link" && rCur && rCur !== item) rHist.push(rCur);
    if (how === "new") rHist.length = 0;
    rCur = item;
    unpin();
    hideTip();
    const card = $("r-card");
    card.replaceChildren();
    const go = m => openReader(m, "link"), goFacet = (k, v) => openReader({ facet: [k, v] }, "link");
    if (item.facet) fillFacet(card, item.facet[0], item.facet[1], false, go);
    else fillArticle(card, item, false, go, goFacet);
    reader.hidden = false;
    document.body.classList.add("reading");
    reader.scrollTop = 0;
    $("r-back").hidden = !rHist.length; // nur nach einem Link zu einer anderen Seite
    $("r-close").focus({ preventScroll: true });
    const spot = anchor ? [...card.querySelectorAll("[id]")].find(x => x.id === anchor) : null;
    if (spot) { spot.scrollIntoView({ block: "center" }); spot.classList.add("flash"); }
  }
  function closeReader() {
    if (reader.hidden) return;
    reader.hidden = true;
    document.body.classList.remove("reading");
    const n = rCur;
    rCur = null;
    rHist.length = 0;
    if (n && !n.facet) select(n, true);
  }
  $("r-close").addEventListener("click", () => closeReader());
  $("r-back").addEventListener("click", () => { const prev = rHist.pop(); if (prev) openReader(prev, "back"); });
  document.addEventListener("keydown", ev => {
    if (ev.key !== "Escape") return;
    if (!reader.hidden) closeReader();
    else if (pinned) { unpin(); hoverN = null; update(); }
  });

  // ---------------------------------------------------------------- Tabelle
  (function pages() {
    const t = $("pages");
    $("tablesum").textContent = `Alle Seiten (${nodes.length})`;
    const cols = [
      // viertes Feld: Sortierschlüssel, wenn er von der Anzeige abweicht (Art in der Reihenfolge der Spalten)
      ["Titel", n => n.title, false], ["Art", n => tlabel(n.type), false, n => typeOrder.indexOf(n.type)],
      ["Unterart", n => (n.subtype ? lab(n.subfield, n.subtype) : ""), false],
      ...(SC ? [[SC.label, n => (n.scope ? scopeLab(n.scope) + (n.scope_derived ? " (abgeleitet)" : "") : ""), false]] : []),
      ...(VIS ? [[VIS.label, n => (n.visibility ? visText(n) : ""), false]] : []),
      ...(licNodes.length ? [["Lizenz", n => licShort(n), false]] : []),
      ["Verbindungen", n => n.nb.size, true],
    ];
    let sortCol = cols.length - 1, dir = -1;
    const thead = h("thead"), tbody = h("tbody");
    t.append(thead, tbody);
    function draw() {
      const tr = h("tr");
      cols.forEach(([name, , num], i) => {
        const th = h("th", { class: num ? "num" : "", scope: "col", tabindex: "0" }, name);
        if (i === sortCol) th.setAttribute("aria-sort", dir > 0 ? "ascending" : "descending");
        const act = () => { if (sortCol === i) dir = -dir; else { sortCol = i; dir = num ? -1 : 1; } draw(); };
        th.addEventListener("click", act);
        th.addEventListener("keydown", ev => { if (ev.key === "Enter") act(); });
        tr.append(th);
      });
      tr.append(h("th", { scope: "col" }, ""));
      thead.replaceChildren(tr);
      const get = cols[sortCol][3] || cols[sortCol][1];
      const shown = nodes.filter(inScope);
      $("tablesum").textContent = shown.length === nodes.length ? `Alle Seiten (${nodes.length})` : `Seiten im gewählten ${SC.label} (${shown.length} von ${nodes.length})`;
      const rows = shown.sort((a, b) => { const x = get(a), y = get(b); return (typeof x === "number" ? x - y : String(x).localeCompare(String(y))) * dir || a.title.localeCompare(b.title); });
      tbody.replaceChildren(...rows.map(n => h("tr", { onclick: () => { select(n, true); document.querySelector(".netz").scrollIntoView({ behavior: "smooth", block: "start" }); } },
        h("td", {}, h("span", { class: "pill" }, dotSvg(paint(n), 11), n.title), n.description ? h("div", { class: "d" }, n.description) : null),
        ...cols.slice(1).map(([, f, num]) => h("td", { class: num ? "num" : "" }, String(f(n) ?? ""))),
        h("td", {}, h("button", { class: "ghost", type: "button", onclick: ev => { ev.stopPropagation(); openReader(n, "new"); } }, "Lesen")))));
    }
    draw();
    redrawTable = draw;
  })();

  // ---------------------------------------------------------------- Glossar: Titel, Aliase und Beschreibung der Begriffsseiten
  (function glossary() {
    const gtypes = new Set(D.glossary || []);
    const terms = nodes.filter(n => gtypes.has(n.type)).sort((a, b) => coll.compare(a.title, b.title));
    if (!terms.length) return;
    const letterOf = t => { const c = (t || "").normalize("NFD").replace(/[̀-ͯ]/g, "").charAt(0).toUpperCase(); return c >= "A" && c <= "Z" ? c : "#"; };
    const LETTERS = [..."ABCDEFGHIJKLMNOPQRSTUVWXYZ", "#"];
    const aka = n => { const seen = new Set([n.title.toLowerCase()]); return n.aliases.filter(a => !seen.has(a.toLowerCase()) && seen.add(a.toLowerCase())); };
    const from = typeOrder.filter(t => gtypes.has(t) && terms.some(n => n.type === t)).map(tlabel).join(" und ");
    const input = h("input", { type: "search", placeholder: "Begriff oder Alias …", "aria-label": "Glossar durchsuchen" });
    const letters = h("div", { class: "letters", role: "group", "aria-label": "Zum Anfangsbuchstaben springen" });
    const hits = h("span", { class: "hitcount", "aria-live": "polite" });
    const list = h("div", { class: "gl-cols" });
    $("glossbody").append(h("div", { class: "gl-bar" }, input, letters, hits), list);
    function draw() {
      const q = input.value.trim().toLowerCase();
      const inS = terms.filter(inScope);
      const shown = inS.filter(n => !q || [n.title, n.description, ...n.aliases].some(x => (x || "").toLowerCase().includes(q)));
      const groups = new Map();
      for (const n of shown) { const l = letterOf(n.title); if (!groups.has(l)) groups.set(l, []); groups.get(l).push(n); }
      list.replaceChildren(...[...groups].map(([l, ms]) => h("section", { class: "gl-group", id: `gl-${l}` }, h("h3", {}, l),
        h("dl", { class: "gl" }, ...ms.map(n => {
          const a = aka(n);
          return h("div", { class: "gl-entry" },
            h("dt", {}, h("button", { class: "linkish", type: "button", onclick: () => openReader(n, "new") }, n.title),
              h("span", { class: "kind pill" }, typeDot(n.type), tlabel(n.type))),
            n.description ? h("dd", {}, n.description) : null,
            a.length ? h("dd", { class: "aka" }, "Auch: " + a.join(" · ")) : null);
        })))));
      if (!shown.length) list.append(h("p", { class: "gl-empty" }, "Kein Begriff passt."));
      letters.replaceChildren(...LETTERS.filter(l => l !== "#" || groups.has("#")).map(l => h("button",
        groups.has(l) ? { type: "button", onclick: () => $(`gl-${l}`).scrollIntoView({ behavior: "smooth", block: "start" }) } : { type: "button", disabled: "" }, l)));
      hits.textContent = q ? `${shown.length} von ${inS.length}` : "";
      const part = inS.length < terms.length ? ` (im gewählten ${SC.label}, ${terms.length} insgesamt)` : "";
      $("glosssum").replaceChildren("Glossar", h("span", { class: "sumnote" }, ` · ${inS.length} ${inS.length === 1 ? "Begriff" : "Begriffe"} aus ${from}${part}`));
    }
    input.addEventListener("input", draw);
    draw();
    redrawGlossary = draw;
    $("glosscard").hidden = false;
  })();

  // ---------------------------------------------------------------- Offene Stellen: Widersprüche, „zu prüfen“, [!todo]
  (function openSpots() {
    const all = nodes.flatMap(n => (n.open || []).map(o => ({ n, ...o })));
    if (!all.length) return;
    const tOrder = Object.fromEntries(typeOrder.map((t, i) => [t, i]));
    const byPage = (a, b) => tOrder[a.n.type] - tOrder[b.n.type] || coll.compare(a.n.title, b.n.title);
    const NAMES = { contra: ["Widerspruch", "Widersprüche"], check: ["Stelle zu prüfen", "Stellen zu prüfen"], todo: ["offen", "offen"] };
    const go = o => openReader(o.n, "new", o.id);
    const snip = o => h("button", { class: "snip", type: "button", onclick: () => go(o) }, o.text || "(ohne Text)");
    function draw() {
      const shown = all.filter(o => inScope(o.n));
      const of = k => shown.filter(o => o.kind === k).sort(byPage);
      const contra = of("contra"), check = of("check"), todo = of("todo");
      const body = $("openbody");
      body.replaceChildren(h("p", { class: "note" }, "Was die Seiten selbst als Widerspruch, „zu prüfen“ oder offen ([!todo]) markieren. Ein Klick öffnet die Fundstelle in der Leseansicht."));
      for (const [k, list, title] of [["contra", contra, "Widersprüche"], ["check", check, "Zu prüfen"]]) {
        if (!list.length) continue;
        body.append(h("section", { class: "open-group" }, h("h3", {}, h("span", { class: `mark ${k}`, "aria-hidden": "true" }), `${title} (${list.length})`),
          h("ul", { class: "open-list" }, ...list.map(o => h("li", {},
            h("button", { class: "linkish", type: "button", onclick: () => go(o) }, o.n.title),
            h("span", { class: "kind pill" }, typeDot(o.n.type), tlabel(o.n.type)), h("div", {}, snip(o)))))));
      }
      if (todo.length) {
        const pages = new Map();
        for (const o of todo) { if (!pages.has(o.n)) pages.set(o.n, []); pages.get(o.n).push(o); }
        const det = h("details", { class: "sub" }, h("summary", {}, h("span", { class: "mark todo", "aria-hidden": "true" }),
          ` Offen ([!todo]): ${todo.length} ${todo.length === 1 ? "Stelle" : "Stellen"} auf ${pages.size} ${pages.size === 1 ? "Seite" : "Seiten"}`));
        // erst beim Aufklappen aufbauen: in großen Wikis sind es über tausend Stellen
        det.addEventListener("toggle", () => {
          if (!det.open || det.dataset.built) return;
          det.dataset.built = "1";
          det.append(h("ul", { class: "open-list" }, ...[...pages].map(([n, os]) => h("li", {}, h("details", {},
            h("summary", {}, n.title, h("span", { class: "sumnote" }, ` · ${tlabel(n.type)} · ${os.length}`)),
            h("ul", { class: "open-list" }, ...os.map(o => h("li", {}, snip(o)))))))));
        });
        body.append(det);
      }
      if (!shown.length) body.append(h("p", { class: "gl-empty" }, "Im gewählten Umfang keine offenen Stellen."));
      const parts = [["contra", contra], ["check", check], ["todo", todo]].filter(([, l]) => l.length)
        .map(([k, l]) => `${l.length} ${NAMES[k][l.length === 1 ? 0 : 1]}`);
      const part = shown.length < all.length ? ` (im gewählten ${SC.label}, ${all.length} insgesamt)` : "";
      $("opensum").replaceChildren("Offene Stellen", h("span", { class: "sumnote" }, ` · ${parts.join(" · ") || "keine"}${part}`));
    }
    draw();
    redrawOpen = draw;
    $("opencard").hidden = false;
  })();

  // ---------------------------------------------------------------- Zur Freigabe (nur normale Ausgabe, nur lesend)
  // Seiten mit Gegenprüfung zum jetzigen Inhalt, aber ohne gültige Freigabe durch einen Menschen, und verfallene
  // Freigaben. Das Dashboard schreibt nichts; es baut den verify-Aufruf für die markierten Seiten zum Kopieren.
  (function releaseQueue() {
    const R = D.release;
    if (!R || !(R.pending.length || R.outdated.length || (R.unhashed || []).length)) return;
    const tOrder = Object.fromEntries(typeOrder.map((t, i) => [t, i]));
    const order = (a, b) => tOrder[a.n.type] - tOrder[b.n.type] || coll.compare(a.n.title, b.n.title);
    const pending = R.pending.map(r => ({ ...r, n: byId.get(r.id) })).filter(r => r.n).sort(order);
    const outdated = R.outdated.map(r => ({ ...r, n: byId.get(r.id) })).filter(r => r.n).sort(order);
    const unhashed = (R.unhashed || []).map(r => ({ ...r, n: byId.get(r.id) })).filter(r => r.n).sort(order);
    const marked = new Set();
    const q = v => (/^[\w.:\/@%+=,-]+$/.test(v) ? v : `'${v.replace(/'/g, "'\\''")}'`);
    const who = h("input", { type: "text", value: R.human || "human:", "aria-label": "Kennung der prüfenden Person", spellcheck: "false" });
    const note = h("input", { type: "text", value: "Charge", "aria-label": "Notiz für alle markierten Seiten" });
    const code = h("code", {});
    const copy = h("button", { class: "ghost", type: "button", onclick: () => marked.size && copyText(code.textContent, copy) }, "Kopieren");
    function command() {
      const ids = pending.filter(r => marked.has(r.id)).map(r => r.id);
      code.textContent = ids.length ? `${R.command} ${ids.join(" ")} --by ${q(who.value.trim())} --status stable`
        + (note.value.trim() ? ` --note ${q(note.value.trim())}` : "") : "Noch keine Seite markiert.";
      copy.disabled = !ids.length;
      $("relsum").replaceChildren("Zur Freigabe", h("span", { class: "sumnote" }, ` · ${pending.length} gegengeprüft`
        + (outdated.length ? ` · ${outdated.length} ${outdated.length === 1 ? "Freigabe" : "Freigaben"} verfallen` : "")
        + (unhashed.length ? ` · ${unhashed.length} ohne Prüfwert` : "")
        + (marked.size ? ` · ${marked.size} markiert` : "")));
    }
    who.addEventListener("input", command);
    note.addEventListener("input", command);
    // Ganzer Text der Seite wie in der Leseansicht; Absätze und Listenpunkte mit Beleg hervorgehoben. Wer freigibt,
    // soll alles sehen, was freigegeben wird, auch Absätze ohne Fußnote.
    const LONG = 1600;   // Zeichen; längere Seiten zeigen zuerst die belegten Aussagen, der ganze Text klappt auf
    function fullText(n) {
      const div = h("div", { class: "prose-content rel-full" });
      div.innerHTML = n.html; // im Kern aus Markdown erzeugt; rohes HTML der Seiten ist dort bereits maskiert
      for (const el of div.querySelectorAll("[id]")) el.removeAttribute("id"); // Anker gehören der Leseansicht
      const blocks = [...div.querySelectorAll("p, li")].filter(el => !el.closest(".footnote")
        && (el.tagName === "P" || !el.querySelector(":scope > p")) && el.textContent.trim());
      let bare = 0;
      for (const el of blocks) {
        const hit = [...el.querySelectorAll(".cite, a.footnote-ref")].some(c => c.closest("p, li") === el);
        el.classList.toggle("rel-hit", hit);
        bare += !hit;
      }
      div.addEventListener("click", ev => {
        const a = ev.target.closest("a");
        if (!a) return;
        if (a.dataset.page) { ev.preventDefault(); const m = byId.get(a.dataset.page); if (m) openReader(m, "new"); }
        else if (a.classList.contains("missing") || (a.getAttribute("href") || "").startsWith("#")) ev.preventDefault();
        else { a.target = "_blank"; a.rel = "noopener"; }
      });
      return { div, bare, long: div.textContent.length > LONG };
    }
    const bareText = k => `${k} ${k === 1 ? "Absatz" : "Absätze"} ohne Fußnote`;
    const claimList = r => (r.claims.length ? h("ol", { class: "rel-claims" }, ...r.claims.map(c => h("li", {},
      ...c.text.split(/(\[\^[^\]\s]+\])/).map(part => (/^\[\^/.test(part) ? h("sup", {}, part.slice(2, -1)) : part)),
      h("ul", { class: "rel-notes" }, ...c.notes.map(([label, text]) => h("li", {}, `${label}: ${text || "(Fußnote ohne Text)"}`))))))
      : h("div", { class: "rel-check" }, "Keine Aussagen mit Fußnote."));
    const boxes = [];
    const item = r => {
      const full = fullText(r.n);
      const box = h("input", { type: "checkbox", "aria-label": `${r.n.title} markieren`, onchange: () => { box.checked ? marked.add(r.id) : marked.delete(r.id); command(); } });
      boxes.push(box);
      return h("li", {},
        h("div", { class: "rel-head" }, box,
          h("button", { class: "linkish", type: "button", onclick: () => openReader(r.n, "new") }, r.n.title),
          h("span", { class: "kind pill" }, typeDot(r.n.type), tlabel(r.n.type)),
          r.renew ? h("span", { class: "tag internal", title: "Die frühere Freigabe galt einem anderen Inhalt" }, "Freigabe verfallen, neu gegengeprüft") : null),
        h("div", { class: "rel-check" }, `Gegenprüfung ${r.check_by} · ${day(r.check_at)}` + (r.note ? ` · ${r.note}` : "")
          + (full.bare ? ` · ${bareText(full.bare)}` : "")),
        ...(full.long ? [claimList(r), h("details", { class: "rel-more" },
          h("summary", {}, "Ganze Seite" + (full.bare ? ` · ${bareText(full.bare)}` : "")), full.div)] : [full.div]));
    };
    const all = h("button", { class: "ghost", type: "button", onclick: () => {
      const on = marked.size < pending.length;
      for (const [i, r] of pending.entries()) { boxes[i].checked = on; on ? marked.add(r.id) : marked.delete(r.id); }
      command();
    } }, "Alle markieren");
    const body = $("relbody");
    body.append(h("p", { class: "note" }, "Seiten, die Claude oder ein Prozess zum jetzigen Inhalt gegengeprüft hat und die noch kein Mensch freigegeben hat, je mit dem ganzen Text; Absätze mit Beleg sind hervorgehoben. Lange Seiten zeigen zuerst die belegten Aussagen, der ganze Text klappt auf. Markieren, Befehl kopieren, im Projektordner ausführen; das Dashboard selbst ändert nichts."));
    if (pending.length) {
      body.append(h("div", { class: "rel-bar" }, h("label", {}, "Kennung", who), h("label", {}, "Notiz", note), all),
        h("ul", { class: "rel-list" }, ...pending.map(item)),
        h("div", { class: "rel-cmd" }, code, copy));
    }
    if (outdated.length) {
      body.append(h("section", { class: "open-group" }, h("h3", {}, h("span", { class: "mark contra", "aria-hidden": "true" }),
        `Freigabe verfallen, Gegenprüfung fehlt (${outdated.length})`),
        h("ul", { class: "open-list" }, ...outdated.map(r => h("li", {},
          h("button", { class: "linkish", type: "button", onclick: () => openReader(r.n, "new") }, r.n.title),
          h("span", { class: "kind pill" }, typeDot(r.n.type), tlabel(r.n.type)),
          h("div", { class: "rel-check" }, `Freigabe ${r.by} · ${day(r.at)} · ${r.why}`))))));
    }
    if (unhashed.length) {
      // Prüfungen aus der Zeit vor dem Prüfwert: gelten, zählen aber nicht als Gegenprüfung für eine Freigabe.
      // Kein verify-Aufruf: erst neu gegenprüfen lassen, dann stehen die Seiten oben zur Freigabe.
      const ids = unhashed.map(r => r.id).join(" ");
      const line = h("code", {}, R.check_command ? `${R.check_command} ${ids}`
        : `Bitte gegenprüfen lassen (frischer Agent, nur lesend, gegen die Originale), Befunde einarbeiten und mit verify --by ${R.actor} vermerken: ${ids}`);
      const copyLine = h("button", { class: "ghost", type: "button", onclick: () => copyText(line.textContent, copyLine) }, "Kopieren");
      body.append(h("section", { class: "open-group" }, h("h3", {}, h("span", { class: "mark check", "aria-hidden": "true" }),
        `Gegenprüfung ohne Prüfwert (${unhashed.length})`),
        h("p", { class: "note" }, "Diese Prüfungen stammen aus der Zeit vor dem Prüfwert: Sie gelten weiter, zählen aber nicht als Gegenprüfung für eine Freigabe. Erneut gegenprüfen lassen; danach stehen die Seiten oben zur Freigabe."),
        h("ul", { class: "open-list" }, ...unhashed.map(r => h("li", {},
          h("button", { class: "linkish", type: "button", onclick: () => openReader(r.n, "new") }, r.n.title),
          h("span", { class: "kind pill" }, typeDot(r.n.type), tlabel(r.n.type)),
          h("div", { class: "rel-check" }, `Gegenprüfung ${r.by} · ${day(r.at)} · ohne Prüfwert`)))),
        h("div", { class: "rel-cmd" }, line, copyLine)));
    }
    command();
    $("relcard").hidden = false;
  })();

  // Sprungleiste im Kopf zu den Abschnitten unter dem Graphen
  (function jump() {
    const targets = [["lernpfad", "Lernpfad"], ["glosscard", "Glossar"], ["opencard", "Offene Stellen"], ["relcard", "Zur Freigabe"], ["tablecard", "Alle Seiten"]]
      .filter(([id]) => !$(id).hidden);
    if (targets.length < 2) return;
    $("jump").append(...targets.map(([id, label]) => h("button", { class: "linkish", type: "button", onclick: () => {
      const el = $(id);
      if (el.tagName === "DETAILS") el.open = true;
      el.scrollIntoView({ behavior: "smooth", block: "start" });
    } }, label)));
    $("jump").hidden = false;
  })();

  // ---------------------------------------------------------------- Hell oder dunkel
  function setTheme(t) {
    document.documentElement.dataset.theme = t;
    $("th-light").setAttribute("aria-pressed", String(t === "light"));
    $("th-dark").setAttribute("aria-pressed", String(t === "dark"));
    try { localStorage.setItem("okfw-theme", t); } catch (e) { /* ohne Speicher */ }
  }
  $("th-light").addEventListener("click", () => setTheme("light"));
  $("th-dark").addEventListener("click", () => setTheme("dark"));
  setTheme(document.documentElement.dataset.theme === "dark" ? "dark" : "light");

  const allRis = nodes.map(n => n.ris).filter(Boolean);
  $("foot").replaceChildren(`Stand ${day(D.generated)} · erzeugt mit okfw`,
    allRis.length ? h("button", { class: "linkish", type: "button", style: "margin-left:12px", onclick: () => download("quellen.ris", allRis.join("")) }, `Alle ${allRis.length} Quellen als RIS`) : "");
  repaint();
  colorKey();
  renderPanel();
  fit();
  update();
  try { if (localStorage.getItem("okfw-view") === "cols") setView("cols"); } catch (e) { /* ohne Speicher */ }
})();
</script>
</body>
</html>
